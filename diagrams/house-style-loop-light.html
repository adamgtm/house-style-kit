/* Approved process components, September 2026. Footer comes from house.css.
   Token names match house.css: --gold-wash is the pale gold fill (#f4ecd7).
   Serif is for the h1; .ad strong (mock ad copy) is the one approved
   smaller serif here. */

:root{--paper:#faf8f3;--ink:#14130f;--soft:#5c574e;--faint:#8b8478;--line:#e7e2d8;--card:#fff;--blue:#007aff;--gold:#e89a47;--gold-wash:#f4ecd7;--serif:'Instrument Serif',serif;--sans:Inter,sans-serif;--mono:'Spline Sans Mono',monospace}
*{box-sizing:border-box}html,body{margin:0;padding:0}body{background:#ddd;font-family:var(--sans);-webkit-font-smoothing:antialiased}
.sq{width:1080px;height:1080px;display:flex;flex-direction:column;background:#14130f;padding:11px 11px 0;overflow:hidden}
.paper{flex:1;min-height:0;background:var(--paper);color:var(--ink);padding:30px 30px 22px;display:flex;flex-direction:column}
h1{font:400 70px/1.04 var(--serif);-webkit-text-stroke:.7px currentColor;letter-spacing:-.018em;margin:0;text-align:center;color:var(--ink)}
h2,h3,p{margin:0}h2{font-size:29px;line-height:1.15;letter-spacing:-.025em}h3{font-size:26px;line-height:1.15;letter-spacing:-.02em}
.body{position:relative;flex:1;min-height:0;margin-top:24px}.mono{font-family:var(--mono)}.muted{color:var(--soft)}
.logo{display:block;object-fit:contain;background:white;border:1px solid #e7e2d8;padding:5px;flex:none}.icon{flex:none;color:var(--ink);display:block}.icon .accent{stroke:var(--blue)}.icon .fill{fill:var(--blue)}
.box{border:1px solid var(--line);background:var(--card)}.grid{background-image:radial-gradient(#d8d2c4 1px,transparent 1px);background-size:19px 19px}
.down{height:20px;display:flex;justify-content:center;flex:none}.down svg{fill:none;stroke:var(--ink);stroke-width:1.8}
.row{display:flex;align-items:center;gap:18px;padding:15px 22px}.row p{margin-top:5px;font-size:22px;color:var(--soft)}
.build h1{font-size:61px}.build .body{margin-top:19px;display:flex;flex-direction:column;justify-content:center}
.inputs{height:82px;display:flex;align-items:center;padding:14px 20px;gap:16px}.inputs h2{font-size:26px;margin-right:3px}
.input-chip{font:500 20px var(--mono);padding:11px 14px;border:1px solid #cfc8b8;background:var(--paper);box-shadow:3px 3px 0 #e7e2d8;white-space:nowrap}
.agent{height:82px}.agent .logo+.logo{margin-left:-10px}.agent h2{font-size:28px}.agent p{font-size:21px}
.apify{height:310px;flex:none;display:flex;flex-direction:column}.apify-head{padding:11px 20px;display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--line)}.apify-head small{margin-left:auto;font:18px var(--mono);color:var(--soft)}
.actors{display:grid;grid-template-columns:1fr 1fr;gap:11px;padding:13px 16px;flex:1}.terminal{border:1px solid #bdb6a7;background:#faf8f3;position:relative}
.terminal-top{height:24px;display:flex;align-items:center;gap:5px;padding:0 10px;border-bottom:1px solid #ded9cf}.terminal-top i{width:5px;height:5px;border:1px solid #8b8478;border-radius:50%;display:block}.terminal-top span{margin-left:auto;font:12px var(--mono);color:#8b8478}
.terminal-main{display:flex;gap:12px;padding:10px 13px;align-items:center}.terminal-main h3{font:500 23px var(--mono)}.terminal-main p{font:16px var(--mono);margin-top:5px;color:var(--soft)}
.jev{height:70px;border-color:#dbc6d7;background:#fff7fc}.jev h2{font-size:25px}.jev p{font:17px var(--mono);margin-left:auto}.jev .sub{font-size:18px;color:#6d5265;margin-left:8px;font-weight:400}
.folder{height:86px}.folder h2{font-size:28px}.folder p{font:19px var(--mono)}
.alt .box{box-shadow:5px 5px 0 #ded8ca}.alt .input-chip:nth-of-type(2){transform:rotate(-2deg)}.alt .input-chip:nth-of-type(3){transform:rotate(2deg)}
.alt.build .agent{box-shadow:5px 5px 0 #b8d4f4}.alt.build .apify{box-shadow:6px 6px 0 #d8d1c0}.alt.build .terminal{background:#232221;border-color:#3a3835;color:#ede9e1}.alt.build .terminal-top{border-color:#3a3835}.alt.build .terminal-main p{color:#b8b4ac}.alt.build .terminal .icon{color:#ede9e1}.alt.build .terminal .accent{stroke:#e89a47}.alt.build .terminal .fill{fill:#e89a47}.alt.build .jev{box-shadow:5px 5px 0 #e5b6d8}.alt.build .folder{box-shadow:5px 5px 0 #efc38d}
.alt.build .apify{position:relative}.alt.build .apify-head small{margin-left:48px}.no-cookies-badge{position:absolute;right:12px;top:-11px;z-index:3;display:flex;align-items:center;gap:12px;width:244px;height:68px;padding:8px 13px;background:#fffdf7;border:1px solid #c8b994;box-shadow:3px 3px 0 #e9dcc1;transform:rotate(4deg);font:500 17px/1.35 var(--mono);color:var(--ink)}.no-cookies-badge .cookie-symbol{position:static;width:49px;height:49px;flex:none}
.diagram{width:998px;height:800px;position:relative;margin:auto}.wires{position:absolute;inset:0;width:100%;height:100%;overflow:visible}.wires path{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round}.wires marker path{stroke-width:1.5}.wires .traveler{fill:var(--gold);stroke:var(--paper);stroke-width:3}
.node{position:absolute;padding:21px;display:flex;align-items:center;gap:18px;z-index:2}.node h2{font-size:29px;line-height:1.15}.node p{font-size:22px;line-height:1.35;color:var(--soft);margin-top:8px}.node small{font:15px var(--mono);color:var(--faint)}
.fan .body,.learning .body{display:flex;align-items:center;justify-content:center}.fan .node{padding:18px}.fan .clue h2{font-size:25px}.fan .route h2{font-size:26px}.route .icon{width:54px;height:54px}.return-label{position:absolute;right:45px;top:64px;font:16px var(--mono);color:var(--soft);background:var(--paper);padding:7px}.fan .icon{background-image:radial-gradient(#14130f18 .8px,transparent .8px);background-size:8px 8px}.dark .body{background-image:radial-gradient(#ffffff0d 1px,transparent 1px);background-size:20px 20px}.dark .icon{background-image:radial-gradient(#ffffff24 .8px,transparent .8px)}
.dark{--paper:#1b1b1b;--ink:#ede9e1;--soft:#b8b4ac;--faint:#8f8b84;--line:#3a3835;--card:#232221;--blue:#4da3ff}.dark .grid{background-image:radial-gradient(#ffffff18 1px,transparent 1px)}.dark .box{box-shadow:5px 5px 0 #101010}.dark .node{border-color:#5c5955}.dark .node:before{content:'';position:absolute;top:7px;left:10px;right:10px;height:1px;background:repeating-linear-gradient(90deg,#5c5955 0 5px,transparent 5px 10px)}.dark .node h2{font:500 25px/1.3 var(--mono)}.dark .wire{stroke:#8f8b84}.dark .wires marker path{stroke:#ede9e1}.dark .route .icon .accent{stroke:#e89a47}.dark .route .icon .fill{fill:#e89a47}
.learning .node{display:block;padding:25px 26px}.learning .node .icon{margin-bottom:20px}.learning .node h2{font-size:37px}.learning .node p{font-size:24px}.step{position:absolute;right:21px;top:23px;font:18px var(--mono);color:var(--faint)}
.control{position:absolute;left:354px;width:290px;height:90px;border:1px dashed #b8ac8f;background:var(--gold-wash);display:flex;align-items:center;gap:20px;padding:15px 26px;z-index:2}.control h2{font:500 26px var(--mono)}.control.budget{background:#eaf2fb;border-color:#98b7d8}.control .icon{width:49px;height:49px}
.alt.learning .node{border-color:#c7c0b3}.alt.learning .control{border:2px solid #14130f;box-shadow:4px 4px 0 #ded8ca;transform:rotate(-2deg)}.alt.learning .control.budget{transform:rotate(2deg)}.alt.learning .wire{stroke-dasharray:6 5}.alt.learning .step{color:#007aff}
.hero .sq{width:1600px;height:650px}.hero .paper{padding:34px 30px 18px}.hero h1{font-size:73px}.hero .body{margin-top:20px}.hero-stage{position:relative;width:1518px;height:407px}.hero .cta{height:76px}
.stage{position:absolute;top:20px;height:375px}.stage-label{font:500 24px var(--sans);letter-spacing:-.02em;margin-bottom:25px;white-space:nowrap}.hero .mini-post{width:211px;height:83px;border:1px solid #cfc8ba;background:#fff;padding:14px;position:absolute;left:0;display:flex;gap:11px;box-shadow:3px 4px 0 #e3ddcf}.mini-post:nth-of-type(2){transform:rotate(-5deg);top:65px}.mini-post:nth-of-type(3){transform:rotate(2deg);top:146px;left:15px}.mini-post:nth-of-type(4){transform:rotate(-2deg);top:227px;left:5px}.avatar-dot{width:28px;height:28px;background:#f4ecd7;border:1px solid #bfa97e;flex:none;border-radius:50%}.post-lines{flex:1}.post-lines i{display:block;height:4px;background:#d7d1c4;margin:5px 0 9px}.post-lines i:first-child{width:55%;background:#716b5f}.post-lines i:last-child{width:78%}
.dataset{height:234px;background:#fff;border:1px solid #cfc8ba;position:relative}.filetab{height:37px;border-bottom:1px solid #cfc8ba;font:16px var(--mono);padding:8px 13px;display:flex;align-items:center;gap:9px}.filetab i{width:7px;height:7px;border-radius:50%;background:var(--gold)}.data-row{display:flex;gap:10px;border-bottom:1px solid #e7e2d8;height:31px;padding:10px 12px}.data-row i{height:6px;width:47px;background:#e5dfd3}.data-row i:nth-child(2){width:80px}.data-row:nth-child(3) i{background:#e6c79b}
.tools{display:flex;align-items:center;gap:8px;margin-top:20px}.tools span{font:16px var(--mono);margin-left:3px;color:var(--soft)}.hero .logo{width:39px;height:39px;padding:4px}
.insight{height:234px;padding:20px 17px}.insight svg{width:190px;height:102px}.topic-chip{font:17px var(--mono);display:inline-block;border:1px solid #d4c49f;background:var(--gold-wash);padding:7px 10px;margin-top:8px}.audience-art{height:234px;display:flex;align-items:center;justify-content:center}.audience-art svg{width:207px;height:207px}.ad{height:234px;padding:19px 16px}.ad .icon{margin:1px 0 14px;width:57px;height:57px}.ad strong{font:400 34px/1.06 var(--serif)}.ad .button{font:16px var(--mono);border:1px solid #14130f;padding:8px 12px;display:inline-block;margin-top:18px;background:#14130f;color:#faf8f3}
.alt.hero .dataset{transform:rotate(-2deg);box-shadow:5px 5px 0 #d8d1c0;background:#232221;color:#ede9e1;border-color:#3a3835}.alt.hero .filetab{border-color:#5c5955}.alt.hero .data-row{border-color:#3a3835}.alt.hero .data-row i{background:#5c5955}.alt.hero .data-row:nth-child(3) i{background:#e89a47}.alt.hero .insight{transform:rotate(2deg)}.alt.hero .ad{transform:rotate(-2deg);box-shadow:6px 6px 0 #e8cf9a;border-color:#bba67c}.alt.hero .mini-post:nth-of-type(2){transform:rotate(-9deg)}.alt.hero .mini-post:nth-of-type(3){transform:rotate(6deg)}.alt.hero .audience-art{border-style:dashed}


.cta{flex:none;height:96px;background:#14130f;display:flex;
  align-items:center;justify-content:space-between;gap:28px;padding:0 30px;color:#faf8f3}
.cta-brand{display:flex;align-items:center;gap:13px;flex:none;white-space:nowrap;
  font:700 23px/1.1 var(--sans);letter-spacing:-.005em}
.cta-mark{width:44px;height:44px;padding:4px;display:flex;align-items:center;
  justify-content:center;flex:none;background:#fff;border:1px solid #e7e2d8}
.cta-mark img{display:block;width:34px;height:34px;object-fit:contain}
.cta-action{display:flex;align-items:baseline;justify-content:flex-end;gap:9px;

.cta-action .url,.cta-action a{color:#4da3ff;text-decoration:none}
.cta-action.url-only{font-size:23px;line-height:1.1}

.sq{width:1080px;height:1080px}

/* house-style loop: layout overrides on the approved learning-loop */
h1{font-size:68px;white-space:nowrap}
.learning .node h2{font-size:34px;letter-spacing:-.03em;white-space:nowrap}
.learning .node{padding:25px 22px 25px 26px}.learning .node p{font-size:22px}
.learning .node .promo{display:block;white-space:nowrap}
.learning .node .promo+.promo{margin-top:3px}
.tabcard{position:absolute;left:339px;top:430px;width:320px;height:80px;z-index:2;
  display:flex;align-items:center;gap:18px;padding:12px 24px;background:var(--gold-wash);
  border:2px solid var(--ink);box-shadow:4px 4px 0 var(--shadow);transform:rotate(2deg)}
.tabcard .tab{position:absolute;left:-2px;top:-19px;width:112px;height:22px;background:var(--gold-wash);
  border:2px solid var(--ink);border-bottom:0}
.tabcard .icon{width:44px;height:44px}
.tabcard b{font:500 27px var(--mono);letter-spacing:-.01em;white-space:nowrap}
.phrase{position:absolute;left:324px;top:298px;width:350px;height:78px;z-index:3;
  display:flex;align-items:center;justify-content:center;background:var(--blue-wash);
  border:2px solid var(--ink);box-shadow:4px 4px 0 var(--shadow);transform:rotate(-1.5deg)}
.phrase:after{content:'';position:absolute;left:150px;bottom:-11px;width:20px;height:20px;
  background:var(--blue-wash);border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);
  transform:rotate(45deg)}
.phrase b{font:500 25px var(--mono);letter-spacing:-.01em;white-space:nowrap}
